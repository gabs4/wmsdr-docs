<rect width="820" height="990" fill="#fff"/>
<text class="title" x="28" y="34">WMSDR — chaîne de réception</text>
<text class="sub" x="28" y="54">Cœur 0, processing_task : chaque bloc de 1024 échantillons (21,3 ms à 48 kHz) traverse les deux chemins</text>
<rect x="170" y="70" width="638" height="140" rx="10" fill="#faf8fd" stroke="#d9cfe8" stroke-dasharray="5 4"/>
<text class="band" x="186" y="88">CHEMIN AFFICHAGE  (≈31 images/s)</text>

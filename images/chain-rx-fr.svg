<text class="t3" x="39" y="931" style="text-anchor:start">ABC</text>
<text class="lg" x="72" y="931">nom de MENU / BOUTON</text>
<text class="lgh" x="300" y="786">Prélèvements (copies en lecture seule, la chaîne n'est pas modifiée)</text>
<circle cx="309" cy="807" r="9" fill="#fff" stroke="#c46a00" stroke-width="1.6"/>
<text class="tapn" x="309" y="811">1</text>
<text class="lg" x="324" y="811">Décodeur CW — voie I à la fréquence du codec, avant tout filtrage (CW / CWR)</text>
<circle cx="309" cy="828" r="9" fill="#fff" stroke="#c46a00" stroke-width="1.6"/>
<text class="tapn" x="309" y="832">2</text>
<text class="lg" x="324" y="832">Aide à l'accord CW — avant le filtre de bande (CW / CWR)</text>
<circle cx="309" cy="849" r="9" fill="#fff" stroke="#c46a00" stroke-width="1.6"/>
<text class="tapn" x="309" y="853">3</text>
<text class="lg" x="324" y="853">Fenêtre des décodeurs — SSTV · WeFax · RTTY · PSK31 · FT8</text>
<circle cx="309" cy="870" r="9" fill="#fff" stroke="#c46a00" stroke-width="1.6"/>
<text class="tapn" x="309" y="874">4</text>
<text class="lg" x="324" y="874">Vu-mètre AF — exactement ce qui arrive au DAC</text>
<circle cx="309" cy="891" r="9" fill="#fff" stroke="#c46a00" stroke-width="1.6"/>
<text class="tapn" x="309" y="895">5</text>
<text class="lg" x="324" y="895">Mesure du bruit FM — commande le squelch (SQL)</text>
<text class="note" x="28" y="956" style="font-weight:700;fill:#c46a00">WMSDR ne touche jamais à la HF : il traite la bande de base I/Q que votre transceiver produit déjà.</text>
<text class="note" x="28" y="976">D = 1 · 4 · 4 · 8 pour 8 · 32 · 48 · 96 kHz. En émission phonie, les deux chemins sont suspendus au profit de la chaîne TX.</text>

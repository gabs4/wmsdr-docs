<text class="t3" x="95.0" y="626.5">DNR · DNR LEVEL</text>
<rect x="186" y="576" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="253.0" y="596.5">NR spectrale</text>
<text class="t2" x="253.0" y="611.5">domaine fréquentiel</text>
<text class="t3" x="253.0" y="626.5">FDNR · FDNR ALGO</text>
<rect x="344" y="576" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="411.0" y="596.5">Égaliseur RX</text>
<text class="t2" x="411.0" y="611.5">4 bandes 400–2400 Hz</text>
<text class="t3" x="411.0" y="626.5">onglet EQ</text>
<rect x="502" y="576" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="569.0" y="596.5">AGC</text>
<text class="t2" x="569.0" y="611.5">cible, maintien, retour</text>
<text class="t3" x="569.0" y="626.5">AGC · AGC TARGET</text>
<rect x="660" y="576" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="727.0" y="604.0">Volume</text>
<text class="t3" x="727.0" y="619.0">VOLUME</text>
<rect x="28" y="686" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="95.0" y="706.5">Squelch</text>
<text class="t2" x="95.0" y="721.5">commandé par le bruit</text>
<text class="t3" x="95.0" y="736.5">SQL (FM)</text>
<rect x="186" y="686" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="253.0" y="706.5">Muet</text>
<text class="t2" x="253.0" y="721.5">rampe 10 ms</text>
<text class="t3" x="253.0" y="736.5">MUTE</text>
<rect x="344" y="686" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="411.0" y="706.5">Interpolation ×D</text>
<text class="t2" x="411.0" y="721.5">FIR, mono</text>
<text class="t3" x="411.0" y="736.5">→ fréq. du codec</text>
<rect x="502" y="686" width="134" height="62" rx="7" fill="#e4eefa" stroke="#2f5d8f" stroke-width="1.4"/>
<text class="t1" x="569.0" y="714.0">Limiteur crête</text>
<text class="t2" x="569.0" y="729.0">−1 dBFS, 50 ms</text>
<rect x="660" y="686" width="134" height="62" rx="7" fill="#e4eefa" stroke="#2f5d8f" stroke-width="1.4"/>
<text class="t1" x="727.0" y="706.5">WM8731 DAC</text>
<text class="t2" x="727.0" y="721.5">L = R</text>
<text class="t3" x="727.0" y="736.5">casque · sortie ligne</text>

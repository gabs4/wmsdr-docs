<text class="t2" x="569.0" y="153.0">dB, lissage</text>
<rect x="660" y="114" width="134" height="54" rx="7" fill="#efe9f7" stroke="#6a4c93" stroke-width="1.4"/>
<text class="t1" x="727.0" y="130.5">Spectre · Waterfall</text>

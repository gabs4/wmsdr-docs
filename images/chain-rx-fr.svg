<text class="t1" x="253.0" y="276.5">WM8731 ADC</text>
<text class="t2" x="253.0" y="291.5">entrée ligne L/R ← I/Q</text>
<text class="t2" x="253.0" y="306.5">→ flottant, ±1,0</text>
<rect x="344" y="256" width="134" height="62" rx="7" fill="#e4eefa" stroke="#2f5d8f" stroke-width="1.4"/>
<text class="t1" x="411.0" y="276.5">Atténuateur</text>

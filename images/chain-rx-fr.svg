<text class="t3" x="727.0" y="416.5">NOTCH · NOTCH LEVEL</text>
<rect x="186" y="472" width="134" height="50" rx="7" fill="#e4eefa" stroke="#2f5d8f" stroke-width="1.4"/>
<text class="t1" x="253.0" y="494.0">Discriminateur</text>
<text class="t2" x="253.0" y="509.0">FM, fréq. du codec</text>
<rect x="344" y="472" width="134" height="50" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="411.0" y="494.0">Décimation ÷D</text>
<text class="t2" x="411.0" y="509.0">+ désaccentuation</text>
<rect x="28" y="576" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>

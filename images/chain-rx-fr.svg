<text class="t1" x="95.0" y="386.5">Noise blanker</text>
<text class="t2" x="95.0" y="401.5">impulsions large bande</text>
<text class="t3" x="95.0" y="416.5">NB · NB THRESHOLD</text>
<rect x="186" y="366" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="253.0" y="386.5">Décimation ÷D</text>
<text class="t2" x="253.0" y="401.5">FIR, I et Q</text>
<text class="t3" x="253.0" y="416.5">→ 8 ou 12 kHz</text>
<rect x="344" y="366" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="411.0" y="386.5">Démodulateur</text>
<text class="t2" x="411.0" y="401.5">SSB/CW/DIGI : phasage</text>
<text class="t3" x="411.0" y="416.5">AM : enveloppe</text>
<rect x="502" y="366" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="569.0" y="386.5">Filtre de bande</text>

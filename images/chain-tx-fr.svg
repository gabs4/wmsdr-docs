<path class="mono" d="M320,241.0 L344,241.0"/>
<path class="mono" d="M478,241.0 L502,241.0"/>
<path class="mono" d="M636,241.0 L660,241.0"/>
<path class="mono" d="M794,241.0 L808,241.0 L808,296.0 L12,296.0 L12,351.0 L28,351.0"/>
<path class="mono" d="M162,351.0 L186,351.0"/>
<path class="mono" d="M320,351.0 L344,351.0"/>
<path class="mono" d="M478,351.0 L502,351.0"/>
<path class="mono" d="M636,351.0 L660,351.0"/>
<path class="ext" d="M727.0,382 L727.0,426"/>
<path class="mono" d="M186,454.0 L95.0,454.0 L95.0,382"/>
<text class="tone" x="330" y="458.0">← remplace le micro si TX TONE ≠ MIC</text>
<circle cx="727.0" cy="174" r="9" fill="#fff" stroke="#c46a00" stroke-width="1.6"/>
<text class="tapn" x="727.0" y="178">1</text>
<circle cx="727.0" cy="284" r="9" fill="#fff" stroke="#c46a00" stroke-width="1.6"/>
<text class="tapn" x="727.0" y="288">2</text>
<circle cx="174.0" cy="308" r="9" fill="#fff" stroke="#c46a00" stroke-width="1.6"/>
<text class="tapn" x="174.0" y="312">3</text>
<circle cx="648.0" cy="308" r="9" fill="#fff" stroke="#c46a00" stroke-width="1.6"/>
<text class="tapn" x="648.0" y="312">4</text>
<foreignObject x="28" y="492" width="780" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="font:11.5px 'Segoe UI',Helvetica,Arial,sans-serif;color:#555;line-height:1.45">Pendant l'émission, l'affichage et la chaîne audio de réception sont suspendus ; la zone du spectre affiche le moniteur TX ③.</div></foreignObject>
<rect x="12" y="536" width="796" height="126" rx="10" fill="#fafafa" stroke="#d6d6d6" stroke-dasharray="5 4"/>
<text class="band" x="28" y="552">COMMUTATION PTT (commande, pas d'audio)</text>
<rect x="28" y="562" width="134" height="62" rx="7" fill="#fff1df" stroke="#c46a00" stroke-width="2.4"/>
<text class="t1" x="95.0" y="590.0">PTT micro</text>
<text class="t2" x="95.0" y="605.0">bouton sur le micro</text>
<rect x="186" y="562" width="134" height="62" rx="7" fill="#f1f1f1" stroke="#666666" stroke-width="1.4"/>
<text class="t1" x="253.0" y="590.0">AW9523</text>
<text class="t2" x="253.0" y="605.0">entrée P0_1</text>
<rect x="344" y="562" width="134" height="62" rx="7" fill="#f1f1f1" stroke="#666666" stroke-width="1.4"/>
<text class="t1" x="411.0" y="582.5">Contrôle émission</text>
<text class="t2" x="411.0" y="597.5">RX coupé, micro actif,</text>
<text class="t2" x="411.0" y="612.5">DAC vidé</text>
<rect x="502" y="562" width="134" height="62" rx="7" fill="#f1f1f1" stroke="#666666" stroke-width="1.4"/>
<text class="t1" x="569.0" y="582.5">AW9523</text>
<text class="t2" x="569.0" y="597.5">sortie P0_0 → opto</text>
<text class="t3" x="569.0" y="612.5">TX ARM</text>
<rect x="660" y="562" width="134" height="62" rx="7" fill="#fff1df" stroke="#c46a00" stroke-width="2.4"/>
<text class="t1" x="727.0" y="590.0">Votre transceiver</text>
<text class="t2" x="727.0" y="605.0">PTT (anneau)</text>
<path class="ctl" d="M162,593.0 L186,593.0"/>
<path class="ctl" d="M320,593.0 L344,593.0"/>
<path class="ctl" d="M478,593.0 L502,593.0"/>
<path class="ctl" d="M636,593.0 L660,593.0"/>
<text class="note" x="28" y="646">Au relâchement : fondu vers le silence, puis retour en réception. VOICE TIMEOUT coupe une émission bloquée.</text>
<line x1="12" y1="702" x2="808" y2="702" stroke="#ddd"/>
<text class="lgh" x="28" y="720">Légende</text>
<rect x="28" y="734" width="22" height="13" rx="3" fill="#fff1df" stroke="#c46a00" stroke-width="1.2"/>
<text class="lg" x="58" y="745">équipement externe</text>
<rect x="28" y="754" width="22" height="13" rx="3" fill="#e4eefa" stroke="#2f5d8f" stroke-width="1.2"/>
<text class="lg" x="58" y="765">fréquence du codec (8 · 32 · 48 · 96 kHz)</text>
<rect x="28" y="774" width="22" height="13" rx="3" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.2"/>
<text class="lg" x="58" y="785">fréquence audio (8 ou 12 kHz)</text>
<rect x="28" y="794" width="22" height="13" rx="3" fill="#f1f1f1" stroke="#666666" stroke-width="1.2"/>
<text class="lg" x="58" y="805">logique de commutation</text>
<path class="mono" d="M28,821 L52,821"/>
<text class="lg" x="58" y="825">audio (mono)</text>
<path class="ctl" d="M28,841 L52,841"/>
<text class="lg" x="58" y="845">PTT / commande</text>
<text class="t3" x="28" y="865" style="text-anchor:start">ABC</text>
<text class="lg" x="58" y="865">nom de ligne MENU (onglets TX et MIC)</text>
<text class="lgh" x="300" y="720">Prélèvements (moniteur TX, lecture seule)</text>
<circle cx="309" cy="741" r="9" fill="#fff" stroke="#c46a00" stroke-width="1.6"/>
<text class="tapn" x="309" y="745">1</text>
<text class="lg" x="324" y="745">Barre MIC — niveau après MIC GAIN et le passe-haut 250 Hz</text>
<circle cx="309" cy="762" r="9" fill="#fff" stroke="#c46a00" stroke-width="1.6"/>
<text class="tapn" x="309" y="766">2</text>
<text class="lg" x="324" y="766">Barres EXP · GR · CLIP — ce que retire chaque étage de dynamique</text>
<circle cx="309" cy="783" r="9" fill="#fff" stroke="#c46a00" stroke-width="1.6"/>
<text class="tapn" x="309" y="787">3</text>
<text class="lg" x="324" y="787">Spectre audio TX avec le masque de bande passante</text>
<circle cx="309" cy="804" r="9" fill="#fff" stroke="#c46a00" stroke-width="1.6"/>
<text class="tapn" x="309" y="808">4</text>
<text class="lg" x="324" y="808">Barre OUT — exactement ce qui part vers le transceiver</text>
<text class="note" x="28" y="891">D = 1 · 4 · 4 · 8 pour 8 · 32 · 48 · 96 kHz. La ligne PRESET (RAGCHEW / DX) règle d'un coup les lignes de l'onglet MIC.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 905" width="820" height="905">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c46a00"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker>
</defs>
<style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif;fill:#222}
.title{font-size:20px;font-weight:700;text-anchor:start}
.sub{font-size:12px;fill:#555;text-anchor:start}
.band{font-size:11px;font-weight:700;letter-spacing:.06em;fill:#555;text-anchor:start}
.extl{font-size:11px;font-weight:700;letter-spacing:.06em;fill:#c46a00;text-anchor:start}
.t1{font-size:13px;font-weight:700;text-anchor:middle}
.t2{font-size:11px;fill:#444;text-anchor:middle}
.t3{font-size:10.5px;fill:#555;text-anchor:middle;font-family:Consolas,"Courier New",monospace}
.tapn{font-size:11px;font-weight:700;fill:#c46a00;text-anchor:middle}
.lg{font-size:11.5px;text-anchor:start}
.lgh{font-size:12px;font-weight:700;text-anchor:start}
.note{font-size:11px;fill:#555;text-anchor:start}
.tone{font-size:11px;font-style:italic;fill:#2e7d4f;text-anchor:start}
.mono{fill:none;stroke:#222;stroke-width:1.4;marker-end:url(#ah)}
.ext{fill:none;stroke:#c46a00;stroke-width:2.4;marker-end:url(#ahx)}
.ctl{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 4;marker-end:url(#ahc)}
</style>
<rect width="820" height="905" fill="#fff"/>
<text class="title" x="28" y="34">WMSDR — chaîne d'émission phonie</text>
<text class="sub" x="28" y="54">Cœur 0, processing_task : tant que le PTT du micro est pressé, cette chaîne remplace la réception</text>
<text class="extl" x="28" y="90">DE VOUS</text>
<text class="band" x="804" y="90" style="text-anchor:end">CHEMIN AUDIO  (chaque bloc)</text>
<rect x="28" y="100" width="134" height="62" rx="7" fill="#fff1df" stroke="#c46a00" stroke-width="2.4"/>
<text class="t1" x="95.0" y="120.5">Micro à main</text>
<text class="t2" x="95.0" y="135.5">capsule électret</text>
<text class="t2" x="95.0" y="150.5">+ bouton PTT</text>
<rect x="186" y="100" width="134" height="62" rx="7" fill="#e4eefa" stroke="#2f5d8f" stroke-width="1.4"/>
<text class="t1" x="253.0" y="120.5">WM8731 ADC</text>
<text class="t2" x="253.0" y="135.5">entrée micro, MICBIAS</text>
<text class="t3" x="253.0" y="150.5">MIC BOOST</text>
<rect x="344" y="100" width="134" height="62" rx="7" fill="#e4eefa" stroke="#2f5d8f" stroke-width="1.4"/>
<text class="t1" x="411.0" y="120.5">Micro → mono</text>
<text class="t2" x="411.0" y="135.5">sur les deux voies</text>
<text class="t2" x="411.0" y="150.5">+ garde bit MSB</text>
<rect x="502" y="100" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="569.0" y="120.5">Décimation ÷D</text>
<text class="t2" x="569.0" y="135.5">FIR</text>
<text class="t3" x="569.0" y="150.5">→ 8 ou 12 kHz</text>
<rect x="660" y="100" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="727.0" y="120.5">Gain micro</text>
<text class="t2" x="727.0" y="135.5">+ passe-haut 250 Hz</text>
<text class="t3" x="727.0" y="150.5">MIC GAIN</text>
<rect x="28" y="210" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="95.0" y="230.5">Expandeur</text>
<text class="t2" x="95.0" y="245.5">calme le bruit ambiant</text>
<text class="t3" x="95.0" y="260.5">EXP · EXP THRESH</text>
<rect x="186" y="210" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="253.0" y="230.5">Égaliseur TX</text>
<text class="t2" x="253.0" y="245.5">300 · 1,8k · 2,4k Hz</text>
<text class="t3" x="253.0" y="260.5">EQ · EQ LOW 300</text>
<rect x="344" y="210" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="411.0" y="230.5">Rotateur de phase</text>
<text class="t2" x="411.0" y="245.5">symétrise les crêtes</text>
<text class="t3" x="411.0" y="260.5">ROTATOR</text>
<rect x="502" y="210" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="569.0" y="230.5">Compresseur</text>
<text class="t2" x="569.0" y="245.5">seuil, taux</text>
<text class="t3" x="569.0" y="260.5">COMP · COMP RATIO</text>
<rect x="660" y="210" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="727.0" y="230.5">Écrêteur type HF</text>
<text class="t2" x="727.0" y="245.5">passe-bande complexe</text>
<text class="t3" x="727.0" y="260.5">CLIP · CLIP LEVEL</text>
<rect x="28" y="320" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="95.0" y="340.5">FIR passe-bande</text>
<text class="t2" x="95.0" y="355.5">300 Hz–HICUT, 256 coef.</text>
<text class="t3" x="95.0" y="370.5">TX HICUT</text>
<rect x="186" y="320" width="134" height="62" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="253.0" y="340.5">Interpolation ×D</text>
<text class="t2" x="253.0" y="355.5">FIR</text>
<text class="t3" x="253.0" y="370.5">→ fréq. du codec</text>
<rect x="344" y="320" width="134" height="62" rx="7" fill="#e4eefa" stroke="#2f5d8f" stroke-width="1.4"/>
<text class="t1" x="411.0" y="340.5">Limiteur</text>
<text class="t2" x="411.0" y="355.5">anticipatif, 2 ms</text>
<text class="t2" x="411.0" y="370.5">plafond 0,85</text>
<rect x="502" y="320" width="134" height="62" rx="7" fill="#e4eefa" stroke="#2f5d8f" stroke-width="1.4"/>
<text class="t1" x="569.0" y="340.5">Niveau TX</text>
<text class="t2" x="569.0" y="355.5">+ maintien, fondu</text>
<text class="t3" x="569.0" y="370.5">TX LEVEL</text>
<rect x="660" y="320" width="134" height="62" rx="7" fill="#e4eefa" stroke="#2f5d8f" stroke-width="1.4"/>
<text class="t1" x="727.0" y="340.5">WM8731 DAC</text>
<text class="t2" x="727.0" y="355.5">sortie casque</text>
<text class="t3" x="727.0" y="370.5">TX OUTPUT  L+R / L ONLY</text>
<rect x="186" y="426" width="134" height="56" rx="7" fill="#e5f3e8" stroke="#2e7d4f" stroke-width="1.4"/>
<text class="t1" x="253.0" y="443.5">Tonalité de test</text>
<text class="t2" x="253.0" y="458.5">1 kHz ou 700 + 1900 Hz</text>
<text class="t3" x="253.0" y="473.5">TX TONE</text>
<text class="extl" x="650" y="461.0" style="text-anchor:end">VERS LE TRX →</text>
<rect x="660" y="426" width="134" height="62" rx="7" fill="#fff1df" stroke="#c46a00" stroke-width="2.4"/>
<text class="t1" x="727.0" y="446.5">Votre transceiver</text>
<text class="t2" x="727.0" y="461.5">entrée micro (pointe)</text>
<text class="t2" x="727.0" y="476.5">ex. (tr)uSDX</text>

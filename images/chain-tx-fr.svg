<path class="mono" d="M320,131.0 L344,131.0"/>
<path class="mono" d="M478,131.0 L502,131.0"/>
<path class="mono" d="M636,131.0 L660,131.0"/>
<path class="mono" d="M794,131.0 L808,131.0 L808,186.0 L12,186.0 L12,241.0 L28,241.0"/>
